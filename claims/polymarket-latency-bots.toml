summary = "The famous wallets were real: industrial bots trading around the clock. They stopped in March 2026, when Polymarket's fees reached every crypto market. Replayed on recorded order books with today's fees and realistic delays, no version of the bot beat luck, and the market's own price forecast the outcome better than the bot did."
what_we_tested = "The wallets' month-by-month record from Polymarket's public data, then the bot itself: ten randomly drawn days of order books recorded every 100 ms between May and August 2026, against Binance prices. Six versions (three delays, two safety margins), today's crypto fee, and orders filled only at prices no worse than when they fired."
