[project]
name = "trader-lab"
version = "0.1.0"
description = "Honest backtests of trading-bot claims: real data, realistic UK fees, correct statistics"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "pyarrow>=17",
    "requests>=2.32",
    "matplotlib>=3.9",
    "duckdb>=1.5.6",
    "pytz>=2026.5",
]

[dependency-groups]
dev = ["pytest>=8"]
render = [
    "playwright>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
